<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>せんろをつなごう！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf5e6;--ink:#5b4636;--go:#5cc777;--go2:#3a9f55;--sel:#ff9f43;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Kosugi Maru","M PLUS Rounded 1c","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:700;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
svg{display:block}
#app{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:linear-gradient(180deg,#e3f4ff 0%,#fdf5e6 45%,#fdf5e6 100%)}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none}
.screen.on{display:-webkit-flex;display:flex}

/* ---------- game layout ---------- */
/* 古いブラウザでも動くように grid と flex の gap は使わず、flex と margin で並べる */
#game.on{flex-direction:column;padding:8px}
#hud{flex:none;display:flex;align-items:center;height:clamp(64px,10vmin,84px);margin-bottom:8px}
#hud > * + *{margin-left:10px}
#main{flex:1 1 0px;min-height:0;display:flex;flex-direction:row}
#left{flex:1 1 0px;min-width:0;min-height:0;display:flex;flex-direction:column}
.hbtn{flex:none;width:clamp(64px,10vmin,84px);height:100%;border-radius:20px;background:#fff;box-shadow:0 4px 0 #ead9be;display:flex;align-items:center;justify-content:center}
.hbtn svg{width:68%;height:68%}
.hbtn:active,.abtn:active,.cbtn:active,.sbtn:active,.tcard:active,#btnPlay:active{transform:translateY(3px)}
#btnTrain{width:clamp(110px,18vmin,150px)}
#btnTrain svg{width:92%;height:auto}
#dots{flex:1;overflow:hidden;padding:6px 4px;display:flex;justify-content:center;align-items:center;min-width:0}
.dot{flex:none;width:clamp(16px,3.2vmin,28px);height:clamp(16px,3.2vmin,28px);margin:0 clamp(3px,.7vmin,6px);border-radius:50%;background:#fff;border:3px solid #e3cfae;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.dot svg{width:80%;height:80%}
.dot.clr{background:#ffe27a;border-color:#f2b632}
.dot.cur{transform:scale(1.35);border-color:var(--sel);box-shadow:0 0 0 3px rgba(255,159,67,.25)}
#boardWrap{flex:1 1 0px;position:relative;min-height:0;min-width:0}
#board{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
#actions{flex:none;display:flex;flex-direction:column;width:clamp(112px,17vw,180px);min-height:0;margin-left:8px}
#actions .abtn + .abtn{margin-top:8px}
.abtn{flex:1 1 0px;min-height:64px;min-width:64px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #e3d0b4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(15px,2.4vmin,22px);line-height:1.1;transition:opacity .2s}
.abtn svg{height:50%;max-height:58px;width:auto;flex:none}
#btnGo{flex:1.8 1 0px;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go2);font-size:clamp(18px,3.2vmin,30px);font-weight:900}
#btnGo.ready{animation:goPulse 1s ease-in-out infinite}
#btnGo.hintglow{outline:6px solid #ffd23f;outline-offset:3px}
@keyframes goPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);box-shadow:0 6px 0 var(--go2),0 0 0 10px rgba(92,199,119,.35)}}
#game.locked .abtn:not(#btnGo),#game.locked #tray{opacity:.45}
#game.locked #btnGo{opacity:.7;animation:none}
#tray{flex:none;margin-top:8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:4px 6px 8px;background:#fff7e8;border-radius:24px;box-shadow:inset 0 0 0 3px #f0dfc3;transition:opacity .2s}
.piece{flex:none;margin:clamp(4px,.8vmin,8px);width:clamp(64px,min(15vh,15vw),118px);height:clamp(64px,min(15vh,15vw),118px);border-radius:18px;padding:0;background:#fff6dd;box-shadow:0 5px 0 #e2cfae;
  border:5px solid #fff;overflow:hidden;transition:transform .15s,border-color .15s}
.piece svg{width:100%;height:100%}
.piece.sel{border-color:var(--sel);transform:scale(1.13) translateY(-5px);box-shadow:0 0 0 6px rgba(255,159,67,.3),0 6px 0 #e08a2d}
.piece.hintglow,.piece.guide{animation:boxGlow .7s ease-in-out infinite alternate}
@keyframes boxGlow{from{box-shadow:0 0 0 4px rgba(255,210,63,.5),0 5px 0 #e2cfae}to{box-shadow:0 0 0 12px rgba(255,210,63,.95),0 5px 0 #e2cfae}}
#tray.nudge{animation:nudge .5s}
@keyframes nudge{20%{transform:translateY(-8px)}40%{transform:translateY(0)}60%{transform:translateY(-5px)}80%{transform:translateY(0)}}
@media (orientation:portrait){
  #main{flex-direction:column}
  #actions{flex-direction:row;width:auto;height:clamp(78px,11vh,116px);margin:8px 0 0}
  #actions .abtn + .abtn{margin:0 0 0 8px}
  #btnGo{flex:1.6 1 0px}
  .abtn svg{height:48%}
  .piece{width:clamp(64px,min(12vh,16.5vw),118px);height:clamp(64px,min(12vh,16.5vw),118px)}
}
@media (orientation:landscape) and (max-height:560px){
  #left{flex-direction:row}
  #hud{height:64px} .hbtn{width:64px} #btnTrain{width:110px}
  #tray{-webkit-order:-1;order:-1;margin:0 8px 0 0;width:calc(2 * (clamp(64px,17vh,90px) + 12px) + 16px);align-content:center;padding:6px}
  .piece{margin:6px;width:clamp(64px,17vh,90px);height:clamp(64px,17vh,90px)}
  .piece.sel{transform:scale(1.08)}
  #bubble{height:64px}
}
#bubble{position:absolute;left:50%;top:8px;height:clamp(64px,10vmin,84px);max-width:calc(100% - 16px);transform:translateX(-50%);display:none;align-items:center;background:#fff;border-radius:999px;padding:6px 24px 6px 14px;
  box-shadow:0 4px 0 #ead9be,0 6px 18px rgba(0,0,0,.12);font-size:clamp(18px,3.4vmin,32px);line-height:1.15;white-space:nowrap;z-index:15;pointer-events:none;border:4px solid #ffe08a}
#bubble svg{flex:none;margin-right:10px}
#bubble.on{display:flex;animation:pop .3s}
#bubble svg{width:1.6em;height:1.6em}
@keyframes pop{from{transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}

/* svg board styles */
.glow{fill:rgba(255,236,130,.35);stroke:#ffcf33;stroke-width:8;animation:glowP .7s ease-in-out infinite alternate}
.glow.brk{stroke:#ffae42;fill:rgba(255,200,120,.35)}
@keyframes glowP{from{opacity:.4}to{opacity:1}}
.ghost{animation:ghostP 1.1s ease-in-out infinite alternate}
@keyframes ghostP{from{opacity:.25}to{opacity:.6}}
.popin{transform-box:fill-box;transform-origin:50% 50%;animation:popin .25s ease-out}
@keyframes popin{from{transform:scale(.55)}70%{transform:scale(1.08)}to{transform:scale(1)}}
.shake{transform-box:fill-box;transform-origin:50% 50%;animation:shake .35s}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.animal{transform-box:fill-box;transform-origin:50% 100%}
.cheer .animal{animation:hop .42s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-14px) scale(.98,1.03)}}
.sparkle{transform-box:fill-box;transform-origin:50% 50%;animation:spark 1.4s ease-out forwards}
@keyframes spark{from{transform:translateY(0) scale(.3);opacity:1}to{transform:translateY(-60px) scale(1.2);opacity:0}}

/* ---------- overlays ---------- */
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(255,248,235,.45);z-index:20}
.overlay.on{display:flex}
.card{background:#fff;border-radius:36px;padding:clamp(16px,3vmin,32px) clamp(18px,4vmin,44px);box-shadow:0 10px 0 #ead9be,0 20px 50px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;animation:cardIn .4s cubic-bezier(.2,1.5,.5,1);max-width:94vw}

.card > * + *{margin-top:clamp(10px,2vmin,20px)}
@keyframes cardIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.big{font-size:clamp(40px,9vmin,92px);font-weight:900;color:#ff7a8a;text-shadow:0 4px 0 #ffe0e5;line-height:1.1;text-align:center}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.row > *{margin:6px clamp(5px,1.2vmin,12px)}
.cbtn{min-height:clamp(80px,13vmin,110px);min-width:clamp(150px,26vmin,240px);padding:0 22px;border-radius:30px;background:#8ec9ff;color:#fff;box-shadow:0 6px 0 #5b9fdc;
  display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4.2vmin,38px);font-weight:900}
.cbtn svg{width:1.5em;height:1.5em;margin:0 8px}
.cbtn.next{background:var(--go);box-shadow:0 6px 0 var(--go2)}
.cbtn.next{animation:goPulse 1.2s ease-in-out infinite}
.stars{display:flex}
.stars svg{margin:0 3px}
.stars svg{width:clamp(36px,7vmin,64px);height:auto;animation:starIn .5s backwards}
.stars svg:nth-child(2){animation-delay:.15s}.stars svg:nth-child(3){animation-delay:.3s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}

/* ---------- title ---------- */
#title.on,#final.on{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#title > * + *,#final > * + *{margin-top:clamp(8px,2.4vmin,22px)}
.logo{font-size:clamp(34px,8vmin,84px);font-weight:900;color:#ff8a5c;letter-spacing:.04em;text-shadow:0 4px 0 #fff,0 7px 0 #ffd9c4;line-height:1.1;text-align:center}
.trainPick{display:flex}
.tcard + .tcard{margin-left:clamp(10px,3vmin,28px)}
.tcard{width:clamp(150px,30vmin,280px);padding:8px 8px 6px;border-radius:26px;background:#fff;border:6px solid #fff;box-shadow:0 5px 0 #ead9be;display:flex;flex-direction:column;align-items:center;font-size:clamp(15px,2.8vmin,24px)}
.tcard svg{width:100%;height:auto}
.tcard.sel{border-color:var(--sel);box-shadow:0 0 0 6px rgba(255,159,67,.25),0 5px 0 #e08a2d;transform:scale(1.04)}
#btnPlay{background:var(--go);color:#fff;font-size:clamp(28px,6vmin,54px);font-weight:900;padding:0 clamp(30px,6vmin,60px);min-height:clamp(80px,13vmin,120px);border-radius:999px;
  box-shadow:0 8px 0 var(--go2);display:flex;align-items:center;animation:goPulse 1.4s ease-in-out infinite}
#btnPlay svg{width:1.2em;height:1.2em;margin-right:14px}
.titleRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
.titleRow > *{margin:clamp(5px,1.5vmin,16px)}
#stageBtns{display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(5 * (clamp(64px,10.5vmin,96px) + clamp(8px,1.8vmin,16px)) + 2px)}
@media (orientation:landscape) and (max-height:560px){ .logo{font-size:32px} .tcard{width:150px} #btnPlay{min-height:72px;font-size:30px} }
.sbtn{position:relative;margin:calc(clamp(8px,1.8vmin,16px) / 2);width:clamp(64px,10.5vmin,96px);height:clamp(64px,10.5vmin,96px);border-radius:22px;background:#fff;box-shadow:0 5px 0 #ead9be;font-size:clamp(28px,5vmin,46px);font-weight:900;color:#7a6250}
.sbtn.clr{background:#fff3c4}
.sbtn .st{position:absolute;top:-10px;right:-10px;width:clamp(26px,4.4vmin,40px);height:auto}
#final .parade{width:96vw;max-width:1000px;height:clamp(70px,16vmin,150px);position:relative;overflow:hidden;border-bottom:6px solid #c9b18f}
#final .parade svg{position:absolute;bottom:0;height:100%;width:auto;animation:parade 7s linear infinite}
@keyframes parade{from{left:-50%}to{left:105%}}
.animalsRow{display:flex;align-items:flex-end}
.animalsRow svg{margin:0 clamp(3px,1vmin,12px)}
.animalsRow svg{width:clamp(56px,11vmin,110px);height:auto;overflow:visible}

/* ---------- misc ---------- */
#hand{position:fixed;left:0;top:0;width:clamp(56px,9vmin,80px);pointer-events:none;z-index:40;display:none;transform-origin:50% 0}
#hand.on{display:block}
#hand svg{width:100%;height:auto;animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(14px)}}
#dragGhost{position:fixed;left:0;top:0;width:clamp(72px,14vmin,120px);height:clamp(72px,14vmin,120px);pointer-events:none;z-index:45;display:none;opacity:.88;transform:translate(-50%,-50%) scale(1.1);
  border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.25);border:5px solid var(--sel)}
#dragGhost svg{width:100%;height:100%}
#confetti{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:60;overflow:hidden}
#confetti i{position:absolute;top:-24px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r))}}
.noaudio{display:none}
[hidden]{display:none!important}
.old-msg{position:fixed;left:8px;right:8px;top:8px;z-index:100;background:#fff3c4;border:3px solid #f2b632;border-radius:14px;padding:10px 14px;font-size:16px}
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="title" class="screen on">
    <div class="logo">せんろを つなごう！</div>
    <div class="titleRow">
      <div class="trainPick">
        <button class="tcard" data-train="hankyu" aria-label="はんきゅうでんしゃ"></button>
        <button class="tcard" data-train="yamanote" aria-label="やまのてせん"></button>
      </div>
      <button id="btnPlay" aria-label="あそぶ"></button>
    </div>
    <div id="stageBtns"></div>
  </section>

  <!-- ゲーム -->
  <section id="game" class="screen">
    <header id="hud">
      <button id="btnHome" class="hbtn" aria-label="おうち"></button>
      <div id="dots"></div>
      <button id="btnTrain" class="hbtn" aria-label="でんしゃを かえる"></button>
      <button id="btnSound" class="hbtn" aria-label="おと"></button>
    </header>
    <div id="main">
      <div id="left">
        <div id="boardWrap">
          <svg id="board" xmlns="http://www.w3.org/2000/svg">
            <g id="lyBg"></g><g id="lyCells"></g><g id="lyHL"></g><g id="lyGhost"></g><g id="lyStation"></g><g id="lyTrain"></g><g id="lyFx"></g>
          </svg>
        </div>
        <div id="tray"></div>
      </div>
      <div id="actions">
        <button id="btnGo" class="abtn"></button>
        <button id="btnUndo" class="abtn"></button>
        <button id="btnReset" class="abtn"></button>
        <button id="btnHint" class="abtn"></button>
      </div>
    </div>
    <div id="bubble"></div>
    <div id="clear" class="overlay">
      <div class="card">
        <div class="stars"></div>
        <div class="big">できたね！</div>
        <div class="row">
          <button id="btnAgain" class="cbtn"></button>
          <button id="btnNext" class="cbtn next"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ぜんぶクリア -->
  <section id="final" class="screen">
    <div class="logo">ぜんぶ できたね！</div>
    <div class="animalsRow"></div>
    <div class="parade"></div>
    <button id="btnTop" class="cbtn next"></button>
  </section>

  <div id="hand"></div>
  <div id="dragGhost"></div>
  <div id="confetti"></div>
</div>
<div class="old-msg" id="oldMsg" hidden>このブラウザでは、うまく動かないところがあります。Chrome を最新にするか、ほかのブラウザで開いてみてください。（さわると消えます）</div>
<script>
  // ブラウザの名前とバージョン（エラーの案内に出す）
  var BROWSER = (function (ua) {
    var m = ua.match(/(Firefox|SamsungBrowser|Edg|OPR|Chrome|Version)\/(\d+)/);
    if (!m) return 'ふめい';
    var name = { Edg: 'Edge', OPR: 'Opera', Version: 'Safari', SamsungBrowser: 'Samsung Internet' }[m[1]] || m[1];
    var os = (ua.match(/Android [\d.]+/) || ua.match(/OS [\d_]+ like Mac/) || [''])[0].replace(/_/g, '.').replace(' like Mac', '');
    return name + ' ' + m[2] + (os ? '（' + os + '）' : '');
  })(navigator.userAgent);
  window.onerror = function () {
    var m = document.getElementById('oldMsg');
    if (m) { m.hidden = false; m.firstChild.nodeValue = m.firstChild.nodeValue.replace('このブラウザ', 'このブラウザ（' + BROWSER + '）'); window.onerror = null; }
  };
  // CSS の変数が使えないほど古いブラウザ（Chrome 48 以前など）では、最初から案内を出す
  if (!(window.CSS && CSS.supports && CSS.supports('--a', '0'))) window.onerror();
  // 古いブラウザにない NodeList.forEach を足す
  if (window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;
  document.getElementById('oldMsg').onclick = function () { this.hidden = true; };
</script>

<script>
(() => {
'use strict';
/* =========================================================
   基本データ
   方向: 0=うえ(N) 1=みぎ(E) 2=した(S) 3=ひだり(W)
   ========================================================= */
const U = 100, PAD = 26, GAP = 60, S0 = 20;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const PIECES = { H:[1,3], V:[0,2], NE:[0,1], ES:[1,2], SW:[2,3], WN:[3,0] };
const CURVE_ROT = { NE:0, ES:90, SW:180, WN:270 };
const CORNER = { NE:[100,0], ES:[100,100], SW:[0,100], WN:[0,0] };
const EDGE = [[50,0],[100,50],[50,100],[0,50]];
const pieceOf = (a,b) => Object.keys(PIECES).find(k => { const p = PIECES[k]; return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a); });

/* ステージ
   '.' = おけるマス  'S:d' = スタート駅(d の向きに でる)  'G:d' = ゴール駅(d の向きから はいる)
   H V NE ES SW WN = はじめから ある せんろ   T=き F=はな P=いけ g=くさ */
const STAGES = [
  { grid:[['T','F','T'],
          ['S:1','.','G:3'],
          ['F','g','F']],
    sol:{'1,1':'H'}, tray:['H'] },
  { grid:[['S:1','.','SW'],
          ['T','F','.'],
          ['F','P','G:0']],
    sol:{'0,1':'H','1,2':'V'}, tray:['H','V'] },
  { grid:[['S:2','T','F'],
          ['V','P','T'],
          ['.','H','G:3']],
    sol:{'2,0':'NE'}, tray:['NE'] },
  { grid:[['S:1','H','.','.'],
          ['F','T','g','V'],
          ['g','P','T','V'],
          ['T','F','g','G:0']],
    sol:{'0,2':'H','0,3':'SW'}, tray:['SW','H'] },
  { grid:[['g','T','F','T'],
          ['.','H','.','.'],
          ['V','P','P','V'],
          ['S:0','F','T','G:0']],
    sol:{'1,0':'ES','1,2':'H','1,3':'SW'}, tray:['H','ES','V','SW'] },          // V が まぎらわしい パーツ
  { grid:[['S:2','T','.','G:3'],
          ['.','P','V','T'],
          ['NE','.','.','.'],
          ['.','F','T','P']],
    sol:{'1,0':'V','2,1':'H','2,2':'WN','0,2':'ES'}, tray:['V','ES','SW','H','WN'] }, // SW が まぎらわしい パーツ
  { grid:[['S:1','H','.','T','F'],
          ['F','T','.','P','P'],
          ['g','F','.','H','.'],
          ['T','g','.','.','V'],
          ['F','P','T','g','G:0']],
    sol:{'0,2':'SW','1,2':'V','2,2':'NE','2,4':'SW'}, tray:['V','SW','ES','NE','H'] },
  { grid:[['T','F','.','H','.'],
          ['g','T','V','P','V'],
          ['.','.','.','T','G:0'],
          ['V','P','P','F','g'],
          ['S:0','F','T','g','T']],
    sol:{'2,0':'ES','2,1':'H','2,2':'WN','0,2':'ES','0,4':'SW'}, tray:['ES','NE','H','SW','V','WN'] },
  // いっしゅう ステージ: 'L:d' = えき (d の むきに でて、はんたいがわ から もどってくる)
  { grid:[['ES','L:1','H','.'],
          ['V','T','P','V'],
          ['V','F','T','.'],
          ['.','H','.','WN']],
    sol:{'0,3':'SW','2,3':'V','3,2':'H','3,0':'NE'}, tray:['SW','H','NE','WN','V'] },
  { grid:[['ES','L:1','.','T','F'],
          ['V','P','.','H','.'],
          ['.','P','.','F','V'],
          ['NE','H','.','H','.'],
          ['T','F','g','P','T']],

function parseCell(tok){
  if (tok === '.') return { kind:'empty' };
  if (PIECES[tok]) return { kind:'rail', piece:tok, fixed:true };
  if (tok[0] === 'S' && tok[1] === ':') return { kind:'start', dir:+tok.slice(2) };
  if (tok[0] === 'G' && tok[1] === ':') return { kind:'goal', dir:+tok.slice(2) };
  if (tok[0] === 'L' && tok[1] === ':') return { kind:'loop', dir:+tok.slice(2) };
  return { kind:'deco', deco:tok };
}
STAGES.forEach(s => {
  s.cells = s.grid.map(row => row.map(parseCell));
  s.H = s.grid.length; s.W = s.grid[0].length;
  s.cells.forEach((row,r) => row.forEach((c,ci) => { if (c.kind==='start') s.start=[r,ci]; if (c.kind==='goal') s.goal=[r,ci]; if (c.kind==='loop'){ s.start=[r,ci]; s.goal=[r,ci]; s.loop=true; } }));
});

/* =========================================================
   線路の判定
   ========================================================= */
function cellAt(st, placed, r, c){
  if (r < 0 || c < 0 || r >= st.H || c >= st.W) return null;
  const base = st.cells[r][c];
  if (base.kind === 'empty') { const p = placed[r+','+c]; return p ? { kind:'rail', piece:p, fixed:false } : base; }
  return base;
}
// スタートから たどる。ok なら route、だめなら どこで きれたか を かえす
function trace(st, placed){
  let [r, c] = st.start, d = st.cells[r][c].dir;
  const route = [{ r, c, inD:null, outD:d }];
  const seen = new Set([r+','+c]);
  for (let guard = 0; guard < 200; guard++){
    const nr = r + DY[d], nc = c + DX[d], need = (d + 2) % 4;
    const t = cellAt(st, placed, nr, nc);
    const fail = reason => ({ ok:false, reason, route, last:[r,c], next: t ? [nr,nc] : null });
    if (!t) return fail('edge');                                   // ばんめんの そと
    if (t.kind === 'loop'){                                        // いっしゅう して えきに もどった
      if (need === (t.dir + 2) % 4) { route.push({ r:nr, c:nc, inD:need, outD:null }); return { ok:true, route }; }
      return fail('goal-side');
    }
    if (seen.has(nr+','+nc)) return fail('loop');                  // ループ
    if (t.kind === 'goal') {
      if (t.dir === need) { route.push({ r:nr, c:nc, inD:need, outD:null }); return { ok:true, route }; }
      return fail('goal-side');
    }
    if (t.kind !== 'rail') return fail(t.kind === 'empty' ? 'gap' : 'blocked'); // きれめ / き・いけ
    const cn = PIECES[t.piece];
    if (!cn.includes(need)) return fail('mismatch');               // むきが あわない
    const out = cn[0] === need ? cn[1] : cn[0];
    seen.add(nr+','+nc);
    route.push({ r:nr, c:nc, inD:need, outD:out });
    r = nr; c = nc; d = out;
  }
  return { ok:false, reason:'loop', route, last:[r,c], next:null };
}
// ひからせる マス をきめる
function breakKey(st, placed, t){
  if (t.next) {
    const n = cellAt(st, placed, t.next[0], t.next[1]);
    if (n && (n.kind === 'empty' || (n.kind === 'rail' && !n.fixed))) return t.next.join(',');
  }
  return t.last.join(',');
}

/* =========================================================
   走る道 (カーブに そって なめらかに)
   ========================================================= */
function buildPath(route){
  const segs = [];
  const E = (r,c,d) => [c*U + EDGE[d][0], r*U + EDGE[d][1]];
  for (const cell of route){
    const { r, c, inD, outD } = cell, cx = c*U+50, cy = r*U+50;
    if (inD == null) segs.push(line([cx,cy], E(r,c,outD)));
    else if (outD == null) segs.push(line(E(r,c,inD), [cx,cy]));
    else if ((inD+2)%4 === outD) segs.push(line(E(r,c,inD), E(r,c,outD)));
    else {
      const k = pieceOf(inD,outD), C = [c*U + CORNER[k][0], r*U + CORNER[k][1]];
      const P1 = E(r,c,inD), P2 = E(r,c,outD);
      const a1 = Math.atan2(P1[1]-C[1], P1[0]-C[0]);
      let da = Math.atan2(P2[1]-C[1], P2[0]-C[0]) - a1;
      while (da > Math.PI) da -= 2*Math.PI; while (da < -Math.PI) da += 2*Math.PI;
      const len = 50*Math.abs(da);
      segs.push({ len, at:s => { const a = a1 + da*(s/len); return [C[0]+50*Math.cos(a), C[1]+50*Math.sin(a)]; } });
    }
  }
  function line(A,B){ const len = Math.hypot(B[0]-A[0], B[1]-A[1]); return { len, at:s => [A[0]+(B[0]-A[0])*s/len, A[1]+(B[1]-A[1])*s/len] }; }
  const L = segs.reduce((a,s) => a + s.len, 0);
  function at(s){
    if (s <= 0){ const g = segs[0], p = g.at(0), q = g.at(Math.min(1,g.len)); const k = s/Math.hypot(q[0]-p[0],q[1]-p[1]); return [p[0]+(q[0]-p[0])*k, p[1]+(q[1]-p[1])*k]; }
    if (s >= L){ const g = segs[segs.length-1], p = g.at(g.len), q = g.at(g.len-1); const k = (s-L)/Math.hypot(p[0]-q[0],p[1]-q[1]); return [p[0]+(p[0]-q[0])*k, p[1]+(p[1]-q[1])*k]; }
    for (const g of segs){ if (s <= g.len) return g.at(s); s -= g.len; }
    return segs[segs.length-1].at(segs[segs.length-1].len);
  }
  return { L, at };
}

let AC = null, jaVoice = null;
function unlockAudio(){

}
function tone(f, d, o = {}){
  if (state.muted || !AC) return;

    const t = AC.currentTime + (o.delay || 0), osc = AC.createOscillator(), g = AC.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    if (o.vib){ const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = o.vib; lg.gain.value = f*0.012; l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t+d+.05); }

  } catch(e) {}
}
function noise(d, o = {}){
  if (state.muted || !AC) return;
  try {
    const t = AC.currentTime + (o.delay || 0), n = Math.floor(AC.sampleRate*d), b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random()*2-1) * (1 - i/n);
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = b; f.type = 'bandpass'; f.frequency.value = o.freq || 800; g.gain.value = o.vol || .2;

  } catch(e) {}
}

  remove(){ tone(520,.13,{to:260,vol:.15}); },

function placeTrain(path, s){
  for (let i = 0; i < 2; i++){
    const si = s - i*GAP, p = path.at(si), a = path.at(si-1.5), b = path.at(si+1.5);
    const ang = Math.atan2(b[1]-a[1], b[0]-a[0]) * 180 / Math.PI;
    const el = document.getElementById('car'+i);

  }
}

/* ---------- そうさ ---------- */
function pushHist(){ state.history.push(JSON.stringify(state.placed)); if (state.history.length > 60) state.history.shift(); }
function afterChange(){
  state.hint = null; state.breakKey = null;

  renderBoard(); renderTray(); renderHL();
  const ok = updateButtons();

}
function selectPiece(t, force){

  state.selected = (state.selected === t && !force) ? null : t;

  renderTray(); updateGuide();
}
function placeAt(k, t){

}
function tapCell(r, c){
  if (locked()) return;
  const st = cur(), base = st.cells[r][c], k = r+','+c;
  if (base.kind === 'empty'){
    if (state.placed[k]){ pushHist(); delete state.placed[k]; sfx.remove(); afterChange(); return; }
    if (!state.selected){
      sfx.boop(); nudgeTray(); showBubble('したの せんろを えらんでね', ICON.hand, 2200); speak('したの せんろを えらんでね'); return;
    }

    const g = document.querySelector(`[data-cell="${k}"]`);

  }
}
function nudgeTray(){ const t = $('#tray'); t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge'); }
function undo(){

  state.placed = JSON.parse(state.history.pop()); sfx.remove(); afterChange();
}
function resetBoard(){

  pushHist(); state.placed = {}; state.selected = null; sfx.remove(); afterChange();
  speak('もういちど やってみよう');
}
function hintTarget(){
  const st = cur(), full = trace(st, st.sol);
  for (const cell of full.route){
    const k = cell.r+','+cell.c;
    if (st.sol[k] && state.placed[k] !== st.sol[k]) return { key:k, piece:st.sol[k], wrong:!!state.placed[k] };
  }
  return null;
}
function hint(){
  if (locked()) return;
  state.breakKey = null;
  if (trace(cur(), state.placed).ok){
    state.hint = { go:true }; renderHL(); sfx.soft(); speak('しゅっぱつ を おしてね'); showBubble('しゅっぱつ を おしてね', ICON.hint, 2400); return;
  }
  const t = hintTarget();
  if (!t) return;
  const level = (state.hint && state.hint.key === t.key) ? 2 : 1;
  state.hint = { ...t, level };
  sfx.soft();
  if (t.wrong){ speak('ここの せんろを タッチして とってみよう'); showBubble('ここを タッチして とってみよう', ICON.hint, 2600); }
  else if (level === 1){ speak('ここだよ'); showBubble('ここだよ', ICON.hint, 2000); }
  else { speak('この かたちを おいてね'); showBubble('この かたちを おいてね', ICON.hint, 2400); }
  renderHL(); renderTray();
}
function go(){
  if (state.running || state.done || state.screen !== 'game') return;   // れんだ ぼうし
  const st = cur(), t = trace(st, state.placed);
  state.hint = null; state.breakKey = null;
  state.running = true; state.selected = null;
  renderTray(); renderHL(); updateButtons(); updateGuide();
  const token = ++state.runToken;
  const path = buildPath(t.route);
  // つながって いなければ、きれめの てまえ で とまる
  const end = t.ok ? path.L : Math.max(S0, path.L - 32);
  const dist = end - S0, T = dist < 1 ? 0.6 : dist/(st.loop ? 145 : 120) + 1.0;
  sfx.whistle(); setTimeout(() => { if (token === state.runToken) speak('しゅっぱつ！'); }, 350);
  let t0 = null, lastChug = 0;
  function frame(ts){
    if (token !== state.runToken) return;
    if (t0 == null) t0 = ts;
    const u = Math.min(1, (ts - t0) / 1000 / T);
    const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
    placeTrain(path, S0 + dist*e);
    if (dist > 1 && ts - lastChug > 280 && u > .05 && u < .92){ sfx.chug(); lastChug = ts; }

  }

function stopAtBreak(token, t){

  const car = document.getElementById('car0');
  if (car){ car.classList.remove('shake'); void car.getBBox; car.firstElementChild.classList.add('shake'); setTimeout(() => car.firstElementChild && car.firstElementChild.classList.remove('shake'), 400); }
  renderHL(); updateButtons(); updateGuide();
  setTimeout(() => { if (token !== state.runToken) return; sfx.soft(); speak('あれれ、とまっちゃった。ここを つないでみよう'); showBubble('ここを つないでみよう', ICON.hint, 3200); }, 450);
}

  let target = null, cell = null;
  if (state.screen === 'game' && state.stage === 0 && !state.running && !state.done){
    const st = cur(), k = Object.keys(st.sol)[0], need = st.sol[k];
    if (trace(st, state.placed).ok) target = $('#btnGo');
    else if (state.placed[k]) cell = k;                         // ちがう せんろ → タップで とる
    else if (state.selected !== need) target = $(`#tray .piece[data-type="${need}"]`);
    else cell = k;
  }
  document.querySelectorAll('#tray .piece').forEach(p => p.classList.toggle('guide', !!target && p === target));
  if (state.guideCell !== cell){ state.guideCell = cell; renderHL(); }
  let pos = null;
  if (target){ const b = target.getBoundingClientRect(); pos = [b.left + b.width/2, b.top + b.height/2]; }
  else if (cell) pos = cellScreenCenter(cell);
  if (!pos){ hand.classList.remove('on'); return; }
  hand.innerHTML = ICON.hand;
  hand.classList.add('on');
  const w = hand.offsetWidth, h = w * 84/60;
  const flip = pos[1] + h + 20 > innerHeight;
  hand.style.transform = flip ? 'rotate(180deg)' : 'none';
  hand.style.left = (pos[0] - w/2) + 'px';
  hand.style.top = (flip ? pos[1] - 4 : pos[1] + 4) + 'px';
  hand.style.transformOrigin = '50% 0';
}

/* =========================================================
   イベント
   ========================================================= */
// ゆび・マウスの そうさ を ひとつに まとめる（Pointer Events が ない 古いブラウザでは touch と mouse を つかう）
const HAS_PTR = !!window.PointerEvent;
let lastTouch = 0;
function onPtr(target, kind, fn){
  if (HAS_PTR){
    target.addEventListener({ down:'pointerdown', move:'pointermove', up:'pointerup', cancel:'pointercancel' }[kind], e => fn({ x:e.clientX, y:e.clientY, id:e.pointerId, target:e.target, ev:e }));
    return;
  }
  const tt = { down:'touchstart', move:'touchmove', up:'touchend', cancel:'touchcancel' }[kind];
  target.addEventListener(tt, e => {
    lastTouch = Date.now();
    for (let i = 0; i < e.changedTouches.length; i++){ const t = e.changedTouches[i]; fn({ x:t.clientX, y:t.clientY, id:'t'+t.identifier, target:e.target, ev:e }); }
  }, { passive:false });
  const mt = { down:'mousedown', move:'mousemove', up:'mouseup' }[kind];
  if (mt) target.addEventListener(mt, e => { if (Date.now() - lastTouch < 800) return; fn({ x:e.clientX, y:e.clientY, id:'mouse', target:e.target, ev:e }); });
}
const unlockOnce = () => { unlockAudio(); state.audioOn = true; };
['pointerdown','touchstart','touchend','mousedown'].forEach(ev => document.addEventListener(ev, unlockOnce, true));
['contextmenu','selectstart','dragstart','gesturestart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('dblclick', e => e.preventDefault());

function cellFromPoint(x, y){
  const svg = $('#board'), m = svg.getScreenCTM(); if (!m) return null;
  const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
  const p = pt.matrixTransform(m.inverse()), st = cur();
  const c = Math.floor(p.x / U), r = Math.floor(p.y / U);
  if (r < 0 || c < 0 || r >= st.H || c >= st.W) return null;
  return [r, c];
}
onPtr($('#board'), 'down', e => {
  if (drag) return;
  if (!HAS_PTR && e.ev.cancelable) e.ev.preventDefault();
  const cell = cellFromPoint(e.x, e.y);
  if (cell) tapCell(cell[0], cell[1]);
});

// パーツ: タップで えらぶ / ドラッグで おく
let drag = null;
const ghost = $('#dragGhost');
onPtr($('#tray'), 'down', e => {
  const b = e.target.closest ? e.target.closest('.piece') : null; if (!b || locked()) return;
  if (e.ev.cancelable) e.ev.preventDefault();
  drag = { type:b.getAttribute('data-type'), x:e.x, y:e.y, id:e.id, moving:false };
});
onPtr(window, 'move', e => {
  if (!drag || e.id !== drag.id) return;
  if (!drag.moving && Math.hypot(e.x - drag.x, e.y - drag.y) > 14){
    drag.moving = true;
    if (state.selected !== drag.type) selectPiece(drag.type, true);
    ghost.innerHTML = tileSVG(drag.type); ghost.style.display = 'block';
  }
  if (drag.moving){ ghost.style.left = e.x + 'px'; ghost.style.top = e.y + 'px'; }
});
onPtr(window, 'up', e => {
  if (!drag || e.id !== drag.id) return;
  const d = drag; drag = null; ghost.style.display = 'none';
  if (!d.moving){ selectPiece(d.type); return; }
  const cell = cellFromPoint(e.x, e.y);
  if (!cell || locked()) return;
  const r = cell[0], c = cell[1], k = r+','+c;
  if (cur().cells[r][c].kind === 'empty'){ if (state.placed[k] !== d.type) placeAt(k, d.type); }
  else sfx.boop();
});
onPtr(window, 'cancel', () => { drag = null; ghost.style.display = 'none'; });

$('#btnGo').addEventListener('click', go);
$('#btnUndo').addEventListener('click', undo);
$('#btnReset').addEventListener('click', resetBoard);
$('#btnHint').addEventListener('click', hint);
$('#btnAgain').addEventListener('click', () => startStage(state.stage));
$('#btnNext').addEventListener('click', () => { if (state.stage < STAGES.length - 1) startStage(state.stage + 1); else finale(); });
$('#btnHome').addEventListener('click', () => { state.runToken++; state.running = false; $('#clear').classList.remove('on'); try { speechSynthesis.cancel(); } catch(e) {} show('title'); });
$('#btnTop').addEventListener('click', () => show('title'));
$('#btnSound').addEventListener('click', () => {
  state.muted = !state.muted; store.set('muted', state.muted);
  if (state.muted){ try { speechSynthesis.cancel(); } catch(e) {} } else sfx.select();
  renderHUD();
});
$('#btnTrain').addEventListener('click', () => {
  if (state.running) return;
  state.train = state.train === 'hankyu' ? 'yamanote' : 'hankyu'; store.set('train', state.train);
  sfx.whistle(); renderHUD();
  if (!state.done) placeTrainIdle(); else { ensureCars(); const t = trace(cur(), state.placed); if (t.ok){ const p = buildPath(t.route); placeTrain(p, p.L); } }
});
document.querySelectorAll('.tcard').forEach(b => b.addEventListener('click', () => {
  state.train = b.getAttribute('data-train'); store.set('train', state.train); sfx.whistle(); renderTitle();
}));
$('#btnPlay').addEventListener('click', () => {
  let i = STAGES.findIndex((s,i) => !state.cleared.has(i)); if (i < 0) i = 0;
  startStage(i);
});
$('#stageBtns').addEventListener('click', e => { const b = e.target.closest('.sbtn'); if (b) startStage(+b.getAttribute('data-stage')); });

window.addEventListener('resize', () => requestAnimationFrame(updateGuide));
if (window.ResizeObserver) new ResizeObserver(() => updateGuide()).observe($('#boardWrap'));

renderTitle();
show('title');

// テストよう
window.__senro = { STAGES, PIECES, trace, buildPath, breakKey, state, startStage, tapCell, selectPiece, go, undo, resetBoard, hint, hintTarget, cellScreenCenter };
})();
</script>
